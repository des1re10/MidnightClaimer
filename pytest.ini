[pytest]
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*
addopts = 
    -v
    --strict-markers
markers =
    gui: marks tests as GUI tests (deselect with '-m "not gui"')
    unit: marks tests as unit tests
    integration: marks tests as integration tests  
    performance: marks tests as performance tests
    slow: marks tests as slow running tests
    network: marks tests that require network access
    bitcoin: marks tests specific to Bitcoin functionality
    cardano: marks tests specific to Cardano functionality
    requires_crypto: marks tests that require crypto libraries
    security: marks tests related to security functionality
filterwarnings =
    ignore::DeprecationWarning
    ignore::PendingDeprecationWarning
