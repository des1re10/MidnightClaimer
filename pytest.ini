[tool:pytest]
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*
addopts = 
    -v
    --strict-markers
    --tb=short
    --cov-branch
    --cov-fail-under=80
markers =
    unit: Unit tests
    integration: Integration tests
    security: Security-related tests
    cardano: Cardano-specific tests
    bitcoin: Bitcoin-specific tests
    gui: GUI tests
    slow: Tests that take a long time to run
    requires_crypto: Tests that require cryptographic libraries
filterwarnings =
    ignore::DeprecationWarning
    ignore::PendingDeprecationWarning